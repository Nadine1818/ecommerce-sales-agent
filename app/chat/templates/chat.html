<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Assistant</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #23221f;
    --ink-soft: #6b6a63;
    --line: #e3e0d6;
    --accent: #3d5a6c;
    --accent-ink: #ffffff;
    --ai-bubble: #eeece4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  select {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .user-info a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    height: 70vh;
    overflow: hidden;
  }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .msg.human {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-ink);
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .msg.pending {
    opacity: 0.55;
  }

  .empty-state {
    margin: auto;
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }

  input[type="text"] {
    flex: 1;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }

  input[type="text"]:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Store Assistant</h1>
      <div class="user-info">
        <span>{{ user_name }}</span>
        <a href="{{ url_for('auth.logout') }}">Log out</a>
      </div>
    </header>

    <div class="panel">
      <div class="log" id="log">
        <div class="empty-state" id="empty-state">Ask about products, shipping, returns — or say what you'd like to order.</div>
      </div>
      <form id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    const log = document.getElementById("log");
    const emptyState = document.getElementById("empty-state");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(role, text) {
      if (emptyState) emptyState.remove();
      const bubble = document.createElement("div");
      bubble.className = "msg " + role;
      bubble.textContent = text;
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    // Conversation stays scoped to whoever is logged in — no picker to
    // switch between anymore; a different customer means logging out
    // and logging back in as them.

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage("human", message);
      input.value = "";
      sendBtn.disabled = true;
      const pending = addMessage("ai", "...");
      pending.classList.add("pending");

      try {
        const response = await fetch("/chat/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message }),
        });
        const data = await response.json();

        pending.classList.remove("pending");
        if (data.error) {
          pending.textContent = "Error: " + data.error;
        } else {
          pending.textContent = data.response;
        }
      } catch (err) {
        pending.classList.remove("pending");
        pending.textContent = "Something went wrong reaching the server.";
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
