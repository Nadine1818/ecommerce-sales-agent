<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Store Assistant</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #23221f;
    --ink-soft: #6b6a63;
    --line: #e3e0d6;
    --accent: #3d5a6c;
    --accent-ink: #ffffff;
    --error-bg: #fbe9e7;
    --error-ink: #8a3a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 24px;
    letter-spacing: -0.01em;
  }
  .flash {
    background: var(--error-bg);
    color: var(--error-ink);
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input[type="email"], input[type="password"] {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    margin-top: 4px;
  }
  .switch {
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-top: 18px;
  }
  .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Log In</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit">Log In</button>
    </form>

    <div class="switch">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
  </div>
</body>
</html>
