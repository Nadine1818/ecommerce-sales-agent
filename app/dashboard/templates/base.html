<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} — Store Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div class="brand">Store Admin</div>
    <nav>
      <a href="{{ url_for('dashboard.products') }}" class="{{ 'active' if request.endpoint == 'dashboard.products' }}">Products</a>
      <a href="{{ url_for('dashboard.orders') }}" class="{{ 'active' if request.endpoint == 'dashboard.orders' }}">Orders</a>
      <a href="{{ url_for('dashboard.customers') }}" class="{{ 'active' if request.endpoint == 'dashboard.customers' }}">Customers</a>
      <a href="{{ url_for('dashboard.rag_data') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('dashboard.rag') }}">Knowledge Base</a>
    </nav>
    <div class="right">
      <span>{{ user_name }}</span>
      <a href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script>
    // Flash messages fade out and remove themselves after a few seconds,
    // instead of sitting on screen until the next page navigation.
    document.querySelectorAll(".flash").forEach(function (el) {
      setTimeout(function () {
        el.classList.add("fade-out");
        setTimeout(function () { el.remove(); }, 400);
      }, 3500);
    });
  </script>
</body>
</html>
