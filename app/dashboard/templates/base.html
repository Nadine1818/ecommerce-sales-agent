<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} — Store Admin</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #23221f;
    --ink-soft: #6b6a63;
    --line: #e3e0d6;
    --accent: #3d5a6c;
    --accent-ink: #ffffff;
    --error-bg: #fbe9e7;
    --error-ink: #8a3a2e;
    --danger: #a3453a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    padding: 16px 0;
  }
  nav {
    display: flex;
    gap: 4px;
  }
  nav a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    padding: 18px 14px;
    border-bottom: 2px solid transparent;
  }
  nav a.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .right {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .right a { color: var(--accent); text-decoration: none; font-weight: 600; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }
  .flash {
    background: var(--error-bg);
    color: var(--error-ink);
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--line);
  }
  th {
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    background: #faf9f6;
  }
  tr:last-child td { border-bottom: none; }
  .empty {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 24px;
    text-align: center;
  }
  .btn {
    display: inline-block;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
  }
  .btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .actions { display: flex; gap: 6px; }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eeece4;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Store Admin</div>
    <nav>
      <a href="{{ url_for('dashboard.products') }}" class="{{ 'active' if request.endpoint == 'dashboard.products' }}">Products</a>
      <a href="{{ url_for('dashboard.orders') }}" class="{{ 'active' if request.endpoint == 'dashboard.orders' }}">Orders</a>
      <a href="{{ url_for('dashboard.customers') }}" class="{{ 'active' if request.endpoint == 'dashboard.customers' }}">Customers</a>
      <a href="{{ url_for('dashboard.rag_data') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('dashboard.rag') }}">RAG Data</a>
    </nav>
    <div class="right">
      <span>{{ user_name }}</span>
      <a href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
