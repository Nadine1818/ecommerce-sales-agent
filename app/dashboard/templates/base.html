<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} — Store Admin</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #23221f;
    --ink-soft: #6b6a63;
    --line: #e3e0d6;
    --accent: #3d5a6c;
    --accent-hover: #32485770;
    --accent-ink: #ffffff;
    --error-bg: #fbe9e7;
    --error-ink: #8a3a2e;
    --danger: #a3453a;
    --danger-bg: #fdf1ef;
    --shadow: 0 1px 2px rgba(35, 34, 31, 0.04), 0 8px 20px -12px rgba(35, 34, 31, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    padding: 16px 0;
    letter-spacing: -0.01em;
  }
  nav {
    display: flex;
    gap: 4px;
  }
  nav a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    padding: 18px 14px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav a:hover { color: var(--ink); }
  nav a.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .right {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .right a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .right a:hover { text-decoration: underline; }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }
  h2 {
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .flash {
    background: var(--error-bg);
    color: var(--error-ink);
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    max-height: 60px;
    overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.4s ease, margin-bottom 0.4s ease, padding 0.4s ease;
  }
  .flash.fade-out {
    opacity: 0;
    max-height: 0;
    margin-bottom: 0;
    padding-top: 0;
    padding-bottom: 0;
  }
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow-x: auto;
    overflow-y: hidden;
  }
  table {
    width: 100%;
    min-width: 560px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    text-align: left;
    padding: 12px 16px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--line);
    overflow-wrap: break-word;
  }
  th {
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: #faf9f6;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background-color 0.1s ease; }
  tbody tr:hover { background: #faf9f6; }
  td.truncate {
    max-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 24px;
    text-align: center;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .btn {
    display: inline-block;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { border-color: #c9c5b8; background: #faf9f6; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-accent:hover { background: #32485e; border-color: #32485e; }
  .btn-danger { color: var(--danger); border-color: var(--line); background: transparent; }
  .btn-danger:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
  /* .actions is a div nested inside the <td>, not the cell itself —
     display:flex directly on a table cell breaks its collapsed border
     rendering (the divider line looks cut off under that column). */
  .actions { display: flex; gap: 8px; white-space: nowrap; }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eeece4;
    color: var(--ink-soft);
  }

  @media (max-width: 760px) {
    header {
      flex-direction: column;
      align-items: stretch;
      padding: 0 16px;
      gap: 0;
    }
    .brand { padding: 14px 0 6px; }
    nav {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -16px;
      padding: 0 16px;
    }
    nav a { padding: 12px 10px; font-size: 13.5px; white-space: nowrap; }
    .right {
      width: 100%;
      justify-content: space-between;
      padding: 10px 0 14px;
      border-top: 1px solid var(--line);
      margin-top: 4px;
    }
    main { padding: 20px 16px 48px; }
    h1 { font-size: 18px; }
    .form-panel { max-width: 100%; padding: 20px; }

    /* Tables become stacked cards instead of scrolling sideways. */
    .table-wrap {
      overflow-x: visible;
      border: none;
      box-shadow: none;
      background: transparent;
    }
    table.stack { min-width: 0; }
    table.stack thead { display: none; }
    table.stack, table.stack tbody, table.stack tr { display: block; }
    table.stack tr {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      padding: 4px 14px;
    }
    table.stack td {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      max-width: none;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      text-align: left;
    }
    table.stack td:last-child { border-bottom: none; }
    table.stack td.truncate { max-width: none; }
    table.stack td::before {
      content: attr(data-label);
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    table.stack td.actions-cell::before { content: none; }
    table.stack td.actions-cell .actions { justify-content: flex-end; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Store Admin</div>
    <nav>
      <a href="{{ url_for('dashboard.products') }}" class="{{ 'active' if request.endpoint == 'dashboard.products' }}">Products</a>
      <a href="{{ url_for('dashboard.orders') }}" class="{{ 'active' if request.endpoint == 'dashboard.orders' }}">Orders</a>
      <a href="{{ url_for('dashboard.customers') }}" class="{{ 'active' if request.endpoint == 'dashboard.customers' }}">Customers</a>
      <a href="{{ url_for('dashboard.rag_data') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('dashboard.rag') }}">RAG Data</a>
    </nav>
    <div class="right">
      <span>{{ user_name }}</span>
      <a href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script>
    // Flash messages fade out and remove themselves after a few seconds,
    // instead of sitting on screen until the next page navigation.
    document.querySelectorAll(".flash").forEach(function (el) {
      setTimeout(function () {
        el.classList.add("fade-out");
        setTimeout(function () { el.remove(); }, 400);
      }, 3500);
    });
  </script>
</body>
</html>
