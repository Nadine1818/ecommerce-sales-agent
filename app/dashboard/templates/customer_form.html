{% extends "base.html" %}
{% block title %}{{ "Edit" if customer else "Add" }} Customer{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/rag_form.css') }}">{% endblock %}
{% block content %}
<h1>{{ "Edit" if customer else "Add" }} Customer</h1>

<form method="POST" class="form-panel">
  <div class="field">
    <label>Name</label>
    <input type="text" name="name" value="{{ form.name if form else (customer.name if customer else '') }}">
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" name="email" value="{{ form.email if form else (customer.email if customer else '') }}">
  </div>

  {% if not customer %}
  <div class="field">
    <label>Password</label>
    <input type="password" name="password" autocomplete="new-password">
    <span class="hint">At least 8 characters.</span>
  </div>
  {% endif %}

  <div class="form-actions">
    <button type="submit" class="btn btn-accent">{{ "Save Changes" if customer else "Add Customer" }}</button>
    <a href="{{ url_for('dashboard.customers') }}" class="btn">Cancel</a>
  </div>
</form>
{% endblock %}
